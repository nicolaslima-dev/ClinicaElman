<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Elman - Auditoria TISS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] },
                    colors: {
                        // Muted, premium teal — pulled back from the brighter default palette
                        brand: { 50: '#f2f7f6', 100: '#dcebe8', 200: '#b7d6cf', 300: '#8bbdb2', 400: '#5c9e91', 500: '#3d8074', 600: '#2f695f', 700: '#26544c', 800: '#1f433d', 900: '#193631', 950: '#0e1f1c' },
                        // Single restrained accent for highlights — a warm, quiet gold
                        gold: { 400: '#c7a468', 500: '#b3915a', 600: '#96794a' },
                        ink: { 50: '#f6f7f6', 100: '#eceef0', 200: '#d7dbdf', 300: '#a9b1ba', 400: '#727d89', 500: '#4c5560', 600: '#333b45', 700: '#232931', 800: '#161b21', 900: '#0d1116', 950: '#080a0d' }
                    },
                    boxShadow: {
                        'soft': '0 1px 2px rgba(13,17,22,0.04), 0 12px 32px -12px rgba(13,17,22,0.10)',
                        'card': '0 1px 2px rgba(13,17,22,0.05), 0 1px 0 rgba(13,17,22,0.03)',
                        'glass': 'inset 0 1px 0 0 rgba(255,255,255,0.08)',
                        'premium': '0 4px 24px -8px rgba(0,0,0,0.05)',
                        'premium-hover': '0 10px 40px -10px rgba(0,0,0,0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f6f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .glass-sidebar {
            background: linear-gradient(175deg, #0d1116 0%, #193631 130%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-link.active {
            position: relative;
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 22px;
            background: #c7a468;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-ink-800 flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <aside
        class="w-72 glass-sidebar flex flex-col text-white transition-all duration-300 z-40 relative shadow-2xl shrink-0">
        <div class="h-24 flex items-center px-7 border-b border-white/10 relative">
            <img src="logo-elman.png" alt="Clínica Elman" class="h-14 w-auto max-w-[200px] object-contain relative z-10"
                onerror="this.outerHTML='<div class=\'text-2xl font-semibold font-heading tracking-tight relative z-10\'>CLÍNICA <span class=\'text-brand-200 font-light\'>elman</span></div>'">
        </div>
        <div class="px-7 py-6 border-b border-white/10 flex items-center gap-4">
            <div
                class="h-11 w-11 rounded-full bg-ink-800 border border-white/10 flex items-center justify-center text-brand-100 font-semibold text-sm">
                IC</div>
            <div>
                <p class="text-sm font-semibold font-heading text-white leading-tight">Ilsa Carla</p>
            </div>
        </div>
        <nav class="flex-1 px-8 py-7 space-y-1 overflow-y-auto hide-scrollbar">
            <p class="text-[11px] font-medium text-brand-200/40 tracking-wide mb-4">Menu principal</p>

            <a href="index.html"
                class="nav-link w-full flex items-center gap-3 py-3 text-sm font-medium text-brand-100/50 hover:text-white transition-colors duration-200">
                <i class="ph ph-squares-four text-lg"></i> Dashboard
            </a>
            <a href="atendimento.html"
                class="nav-link w-full flex items-center gap-3 py-3 text-sm font-medium text-brand-100/50 hover:text-white transition-colors duration-200">
                <i class="ph ph-stethoscope text-lg"></i> Atendimento
            </a>
            <a href="faturamento.html"
                class="nav-link w-full flex items-center gap-3 py-3 text-sm font-medium text-brand-100/50 hover:text-white transition-colors duration-200">
                <i class="ph ph-receipt text-lg"></i> Faturamento TISS
            </a>
            <a href="auditoria.html"
                class="nav-link active w-full flex items-center justify-between py-3 text-sm font-medium text-white">
                <div class="flex items-center gap-3">
                    <i class="ph ph-shield-check text-lg"></i> Auditoria
                </div>
                <span
                    class="bg-gold-500 text-ink-900 text-[10px] font-semibold w-5 h-5 flex items-center justify-center rounded-full"
                    id="sidebar-badge-erros">3</span>
            </a>

            <div class="pt-7 mt-7 border-t border-white/10">
                <p class="text-[11px] font-medium text-brand-200/40 tracking-wide mb-4">Mais relatórios</p>
                <button
                    class="w-full flex items-center gap-3 py-2.5 text-sm font-medium text-brand-100/50 hover:text-white transition-colors"><i
                        class="ph ph-money text-base"></i> Repasse médico</button>
                <button
                    class="w-full flex items-center gap-3 py-2.5 text-sm font-medium text-brand-100/50 hover:text-white transition-colors"><i
                        class="ph ph-calendar text-base"></i> Programação</button>
                <button
                    class="w-full flex items-center gap-3 py-2.5 text-sm font-medium text-brand-100/50 hover:text-white transition-colors"><i
                        class="ph ph-key text-base"></i> Autorizações</button>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#f5f6f5] relative">

        <header
            class="h-20 px-8 flex items-center justify-end bg-white/80 backdrop-blur-md z-30 sticky top-0 border-b border-ink-100/70 shrink-0">
            <div class="flex items-center gap-3">
                <button
                    class="relative p-2.5 text-ink-400 hover:text-brand-700 transition-colors bg-white rounded-full border border-ink-100"><i
                        class="ph ph-bell text-lg"></i><span
                        class="absolute top-2 right-2 w-1.5 h-1.5 bg-gold-500 rounded-full"></span></button>
                <button
                    class="p-2.5 text-ink-400 hover:text-brand-700 transition-colors bg-white rounded-full border border-ink-100"><i
                        class="ph ph-gear text-lg"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 relative z-10" id="views-container">
            <div id="view-auditoria" class="view-section fade-in">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h1 class="text-3xl font-bold font-heading text-slate-900 tracking-tight">Central de Auditoria</h1>
                        <p class="text-sm text-slate-500 mt-2">Resolução de glosas prévias antes do envio Orizon</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="restaurarEstadoPadrao()" title="Restaurar os 3 erros para novos testes" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-xs transition-colors">
                            <i class="ph ph-arrows-clockwise text-sm"></i>
                            Restaurar Testes
                        </button>
                        <span class="bg-red-50 border border-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm transition-all">
                            <i class="ph ph-warning-circle text-lg"></i>
                            <span id="contador-erros-tela">3 Erros Pendentes</span>
                        </span>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-premium border border-slate-100 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/80 border-b border-slate-100 text-xs text-slate-400 uppercase tracking-wider">
                                <th class="p-5 font-semibold">Data</th>
                                <th class="p-5 font-semibold">Paciente</th>
                                <th class="p-5 font-semibold">Convênio</th>
                                <th class="p-5 font-semibold">Status Auditoria</th>
                                <th class="p-5 font-semibold text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm" id="tbodyAuditoria">
                            <!-- Gerado via JS para suportar mocks -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- DRAWER CORREÇÃO -->
    <div id="drawerOverlay" onclick="fecharDrawer()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

    <div id="drawerPanel" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl transform translate-x-full transition-transform duration-400 ease-out z-[60] flex flex-col border-l border-slate-100">
        <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-white">
            <div>
                <h2 class="text-xl font-bold font-heading text-slate-800">Resolução de Glosa</h2>
                <p class="text-xs text-brand-600 font-semibold mt-1 flex items-center gap-1"><i class="ph ph-shield-check"></i> Validação TISS 4.03.00</p>
            </div>
            <button onclick="fecharDrawer()" class="text-slate-400 hover:text-slate-700 p-2 rounded-full hover:bg-slate-100 transition-colors">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <div class="p-8 flex-1 overflow-y-auto" id="drawerContent">
            <!-- Dinâmico via JS -->
        </div>

        <div class="px-8 py-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
            <button onclick="fecharDrawer()" class="px-5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors shadow-sm">Cancelar</button>
            <button onclick="salvarCorrecao()" class="px-5 py-2.5 bg-brand-600 rounded-xl text-sm font-semibold text-white hover:bg-brand-700 shadow-lg shadow-brand-500/30 flex items-center gap-2 transition-all hover:-translate-y-0.5">
                <i class="ph ph-floppy-disk text-lg"></i>
                Validar e Salvar
            </button>
        </div>
    </div>

    <script src="env.js"></script>
    <script src="app.js"></script>
</body>
</html>
