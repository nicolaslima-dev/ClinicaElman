<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Elman - Dashboard Executivo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts (Inter & Outfit for headings) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] },
                    colors: {
                        // Muted, premium teal — pulled back from the brighter default palette
                        brand: { 50: '#f2f7f6', 100: '#dcebe8', 200: '#b7d6cf', 300: '#8bbdb2', 400: '#5c9e91', 500: '#3d8074', 600: '#2f695f', 700: '#26544c', 800: '#1f433d', 900: '#193631', 950: '#0e1f1c' },
                        // Single restrained accent for highlights — a warm, quiet gold
                        gold: { 400: '#c7a468', 500: '#b3915a', 600: '#96794a' },
                        ink: { 50: '#f6f7f6', 100: '#eceef0', 200: '#d7dbdf', 300: '#a9b1ba', 400: '#727d89', 500: '#4c5560', 600: '#333b45', 700: '#232931', 800: '#161b21', 900: '#0d1116', 950: '#080a0d' }
                    },
                    boxShadow: {
                        'soft': '0 1px 2px rgba(13,17,22,0.04), 0 12px 32px -12px rgba(13,17,22,0.10)',
                        'card': '0 1px 2px rgba(13,17,22,0.05), 0 1px 0 rgba(13,17,22,0.03)',
                        'glass': 'inset 0 1px 0 0 rgba(255,255,255,0.08)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f6f5;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Outfit', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-sidebar {
            background: linear-gradient(175deg, #0d1116 0%, #193631 130%);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search bar — a single deliberate pill, quiet by default, defined on focus */
        .search-pill {
            border-radius: 999px;
            background: #eef0ef;
            border: 1px solid transparent;
            transition: background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .search-pill:focus-within {
            background: #ffffff;
            border-color: #d7dbdf;
            box-shadow: 0 0 0 4px rgba(47, 105, 95, 0.08);
        }

        /* KPI cards — solid surface, no outline, hierarchy from shadow + a single accent bar */
        .kpi-card {
            background: #ffffff;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .nav-link.active {
            position: relative;
        }

        .nav-link.active::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 22px;
            background: #c7a468;
            border-radius: 2px;
        }
    </style>
</head>

<body class="text-ink-800 flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <aside
        class="w-72 glass-sidebar flex flex-col text-white transition-all duration-300 z-40 relative shadow-2xl shrink-0">
        <div class="h-20 flex items-center px-7 border-b border-white/10 relative">
            <img src="logo-elman.png" alt="Clínica Elman" class="h-8 w-auto object-contain relative z-10"
                onerror="this.outerHTML='<div class=\'text-xl font-semibold font-heading tracking-tight relative z-10\'>CLÍNICA <span class=\'text-brand-200 font-light\'>elman</span></div>'">
        </div>
        <div class="px-7 py-6 border-b border-white/10 flex items-center gap-4">
            <div
                class="h-11 w-11 rounded-full bg-ink-800 border border-white/10 flex items-center justify-center text-brand-100 font-semibold text-sm">
                IC</div>
            <div>
                <p class="text-sm font-semibold font-heading text-white leading-tight">Ilsa Carla</p>
                <p class="text-xs text-brand-200/60 mt-0.5">Consultora Financeira</p>
            </div>
        </div>
        <nav class="flex-1 px-8 py-7 space-y-1 overflow-y-auto hide-scrollbar">
            <p class="text-[11px] font-medium text-brand-200/40 tracking-wide mb-4">Menu principal</p>

            <a href="dashboard.html"
                class="nav-link active w-full flex items-center gap-3 py-3 text-sm font-medium text-white">
                <i class="ph ph-squares-four text-lg"></i> Dashboard
            </a>
            <a href="atendimento.html"
                class="nav-link w-full flex items-center gap-3 py-3 text-sm font-medium text-brand-100/50 hover:text-white transition-colors duration-200">
                <i class="ph ph-stethoscope text-lg"></i> Atendimento
            </a>
            <a href="faturamento.html"
                class="nav-link w-full flex items-center gap-3 py-3 text-sm font-medium text-brand-100/50 hover:text-white transition-colors duration-200">
                <i class="ph ph-receipt text-lg"></i> Faturamento TISS
            </a>
            <a href="auditoria.html"
                class="nav-link w-full flex items-center justify-between py-3 text-sm font-medium text-brand-100/50 hover:text-white transition-colors duration-200">
                <div class="flex items-center gap-3">
                    <i class="ph ph-shield-check text-lg"></i> Auditoria
                </div>
                <span
                    class="bg-gold-500 text-ink-900 text-[10px] font-semibold w-5 h-5 flex items-center justify-center rounded-full"
                    id="sidebar-badge-erros">3</span>
            </a>

            <div class="pt-7 mt-7 border-t border-white/10">
                <p class="text-[11px] font-medium text-brand-200/40 tracking-wide mb-4">Mais relatórios</p>
                <button
                    class="w-full flex items-center gap-3 py-2.5 text-sm font-medium text-brand-100/50 hover:text-white transition-colors"><i
                        class="ph ph-money text-base"></i> Repasse médico</button>
                <button
                    class="w-full flex items-center gap-3 py-2.5 text-sm font-medium text-brand-100/50 hover:text-white transition-colors"><i
                        class="ph ph-calendar text-base"></i> Programação</button>
                <button
                    class="w-full flex items-center gap-3 py-2.5 text-sm font-medium text-brand-100/50 hover:text-white transition-colors"><i
                        class="ph ph-key text-base"></i> Autorizações</button>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#f5f6f5] relative">

        <header
            class="h-20 px-8 flex items-center justify-between bg-white/80 backdrop-blur-md z-30 sticky top-0 border-b border-ink-100/70 shrink-0">
            <div class="search-pill flex items-center gap-2.5 px-4 py-2.5 w-80">
                <i class="ph ph-magnifying-glass text-base text-ink-400"></i>
                <input type="text" placeholder="Buscar paciente, guia ou procedimento"
                    class="bg-transparent border-none outline-none text-sm w-full placeholder:text-ink-400 text-ink-700">
            </div>
            <div class="flex items-center gap-3">
                <button
                    class="relative p-2.5 text-ink-400 hover:text-brand-700 transition-colors bg-white rounded-full border border-ink-100"><i
                        class="ph ph-bell text-lg"></i><span
                        class="absolute top-2 right-2 w-1.5 h-1.5 bg-gold-500 rounded-full"></span></button>
                <button
                    class="p-2.5 text-ink-400 hover:text-brand-700 transition-colors bg-white rounded-full border border-ink-100"><i
                        class="ph ph-gear text-lg"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 relative z-10" id="views-container">
            <div id="view-dashboard" class="view-section fade-in">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h1 class="text-[28px] font-semibold font-heading text-ink-900 tracking-tight">Dashboard
                            executivo</h1>
                        <p class="text-sm text-ink-400 mt-2 flex items-center gap-2"><i
                                class="ph ph-calendar-blank"></i> Agosto de 2026</p>
                    </div>
                    <a href="auditoria.html"
                        class="bg-ink-900 hover:bg-ink-800 text-white font-medium py-2.5 px-6 rounded-full transition-all text-sm flex items-center gap-2 group">
                        Auditar lotes
                        <i class="ph ph-arrow-right group-hover:translate-x-0.5 transition-transform"></i>
                    </a>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-6" id="dashboard-kpis"></div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                    <div class="lg:col-span-2 bg-white p-7 rounded-[20px] shadow-card">
                        <div class="flex justify-between items-start mb-7">
                            <div>
                                <h3 class="text-base font-semibold font-heading text-ink-900">Volume financeiro por
                                    convênio</h3>
                                <p class="text-xs text-ink-400 mt-1">Valores faturados no mês, em milhares de reais</p>
                            </div>
                            <button class="text-ink-300 hover:text-ink-600 transition-colors"><i
                                    class="ph ph-dots-three-bold text-xl"></i></button>
                        </div>
                        <div class="relative h-72"><canvas id="convenioChart"></canvas></div>
                    </div>
                    <div class="bg-white p-7 rounded-[20px] shadow-card">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="text-base font-semibold font-heading text-ink-900">Glosas evitadas</h3>
                                <p class="text-xs text-ink-400 mt-1">Auditoria prévia TISS</p>
                            </div>
                            <button class="text-ink-300 hover:text-ink-600 transition-colors"><i
                                    class="ph ph-dots-three-bold text-xl"></i></button>
                        </div>
                        <div class="relative h-52 flex justify-center items-center">
                            <canvas id="glosaChart"></canvas>
                            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"
                                id="glosa-center"></div>
                        </div>
                        <div class="mt-5 space-y-3 pt-5 border-t border-ink-100" id="glosa-legend"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /*
          Nota: o app.js original não estava disponível para eu revisar, então os
          dados abaixo são ilustrativos (mesma natureza dos conteúdos do protótipo:
          convênios, glosas evitadas). Basta substituir os arrays por dados reais
          vindos do Supabase quando o app.js for reintegrado.
        */

        // ---------- KPIs ----------
        const kpis = [
            {
                label: 'Faturamento do mês',
                value: 'R$ 842.300',
                delta: '+8,4% vs. julho',
                deltaPositive: true,
                icon: 'ph-currency-circle-dollar',
                accent: '#2f695f'
            },
            {
                label: 'Guias em auditoria',
                value: '128',
                delta: '3 pendências críticas',
                deltaPositive: false,
                icon: 'ph-file-magnifying-glass',
                accent: '#b3915a'
            },
            {
                label: 'Taxa de aprovação TISS',
                value: '96,2%',
                delta: '+1,1 p.p. vs. julho',
                deltaPositive: true,
                icon: 'ph-shield-check',
                accent: '#5c9e91'
            }
        ];

        const kpiContainer = document.getElementById('dashboard-kpis');
        kpiContainer.innerHTML = kpis.map(k => `
            <div class="kpi-card p-6 shadow-card">
                <div style="background:${k.accent}" class="absolute left-0 top-0 bottom-0 w-[3px]"></div>
                <div class="flex items-start justify-between">
                    <p class="text-xs font-medium text-ink-400 tracking-wide">${k.label}</p>
                    <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:${k.accent}1a">
                        <i class="ph ${k.icon} text-base" style="color:${k.accent}"></i>
                    </div>
                </div>
                <p class="text-[26px] font-semibold font-heading text-ink-900 mt-4">${k.value}</p>
                <p class="text-xs mt-2 flex items-center gap-1 ${k.deltaPositive ? 'text-brand-600' : 'text-ink-400'}">
                    <i class="ph ${k.deltaPositive ? 'ph-trend-up' : 'ph-warning-circle'} text-sm"></i> ${k.delta}
                </p>
            </div>
        `).join('');

        // ---------- Bar chart: Volume por Convênio ----------
        const convenioLabels = ['Bradesco', 'Amil', 'SulAmérica', 'Unimed', 'Hapvida', 'Particular'];
        const convenioValues = [186, 142, 118, 205, 97, 64];

        new Chart(document.getElementById('convenioChart'), {
            type: 'bar',
            data: {
                labels: convenioLabels,
                datasets: [{
                    data: convenioValues,
                    backgroundColor: '#2f695f',
                    hoverBackgroundColor: '#1f433d',
                    borderRadius: 6,
                    maxBarThickness: 38
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }, tooltip: {
                        backgroundColor: '#161b21',
                        padding: 10,
                        cornerRadius: 8,
                        displayColors: false,
                        callbacks: { label: (ctx) => `R$ ${ctx.parsed.y} mil` }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#727d89', font: { family: 'Inter', size: 12 } } },
                    y: { grid: { color: '#eceef0' }, border: { display: false }, ticks: { color: '#a9b1ba', font: { family: 'Inter', size: 11 } } }
                }
            }
        });

        // ---------- Donut chart: Glosas Evitadas ----------
        const glosaData = [
            { label: 'Evitadas na pré-auditoria', value: 74, color: '#2f695f' },
            { label: 'Corrigidas antes do envio', value: 18, color: '#8bbdb2' },
            { label: 'Glosadas pela operadora', value: 8, color: '#e2e5e2' }
        ];

        new Chart(document.getElementById('glosaChart'), {
            type: 'doughnut',
            data: {
                labels: glosaData.map(d => d.label),
                datasets: [{
                    data: glosaData.map(d => d.value),
                    backgroundColor: glosaData.map(d => d.color),
                    borderWidth: 3,
                    borderColor: '#ffffff',
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '72%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#161b21',
                        padding: 10,
                        cornerRadius: 8,
                        displayColors: false,
                        callbacks: { label: (ctx) => `${ctx.label}: ${ctx.parsed}%` }
                    }
                }
            }
        });

        document.getElementById('glosa-center').innerHTML = `
            <p class="text-2xl font-semibold font-heading text-ink-900">92%</p>
            <p class="text-[11px] text-ink-400 mt-0.5">evitadas</p>
        `;

        document.getElementById('glosa-legend').innerHTML = glosaData.map(d => `
            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full" style="background:${d.color}"></span>
                    <span class="text-ink-500">${d.label}</span>
                </div>
                <span class="font-medium text-ink-800">${d.value}%</span>
            </div>
        `).join('');
    </script>
</body>

</html>
